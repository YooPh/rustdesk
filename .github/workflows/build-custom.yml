name: Build custom RustDesk packages

on:
  workflow_dispatch:
  push:
    tags:
      - "custom-v*"

# Build only the configured Windows and Android packages.
permissions:
  contents: write

concurrency:
  group: custom-rustdesk-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build configured RustDesk packages
    uses: ./.github/workflows/flutter-build.yml
    with:
      upload-artifact: true
      upload-tag: custom-${{ github.run_number }}
      platforms: "windows,android"
    secrets: inherit
